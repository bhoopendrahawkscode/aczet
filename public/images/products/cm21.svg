<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="microBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="microBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#microBg)"/>

  <!-- Ultra Micro Balance Chassis -->
  <g transform="translate(180, 110)">
    <!-- Base -->
    <rect x="50" y="280" width="340" height="90" rx="10" fill="url(#microBody)" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Color Touchscreen Terminal -->
    <rect x="70" y="295" width="200" height="60" rx="8" fill="#0F172A" stroke="#00D2D3" stroke-width="2"/>
    <text x="170" y="325" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="16" text-anchor="middle">21.000001 g</text>
    <text x="170" y="345" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">d = 1 µg | Filter Weighing</text>

    <!-- Motorized Draft Shield -->
    <rect x="80" y="60" width="280" height="220" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Micro Weighing Pan -->
    <rect x="216" y="190" width="8" height="90" fill="#64748B"/>
    <ellipse cx="220" cy="190" rx="35" ry="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>

    <!-- IR Auto-Door Wave Sensor -->
    <circle cx="340" cy="325" r="14" fill="#0F172A" stroke="#E55604" stroke-width="2"/>
    <path d="M 335 325 Q 340 318 345 325" stroke="#E55604" stroke-width="2" fill="none"/>

    <!-- Branding -->
    <text x="80" y="40" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="22">aczet<tspan fill="#E55604">.</tspan></text>
    <text x="360" y="40" fill="#FF9F66" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="end">CM 21 &#8226; ULTRA MICRO</text>
  </g>
</svg>
