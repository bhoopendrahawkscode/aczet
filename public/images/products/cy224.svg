<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.08)" />
    </linearGradient>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Precision Analytical Balance Instrument -->
  <g filter="url(#dropShadow)" transform="translate(180, 100)">
    <!-- Base Chassis -->
    <path d="M 40 320 L 400 320 L 420 370 L 20 370 Z" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Base Feet (Adjustable Leveling) -->
    <ellipse cx="60" cy="375" rx="18" ry="6" fill="#475569"/>
    <ellipse cx="380" cy="375" rx="18" ry="6" fill="#475569"/>

    <!-- Touch Display / Control Panel -->
    <rect x="100" y="330" width="240" height="32" rx="6" fill="#0A192F" stroke="#E55604" stroke-width="2"/>
    <text x="220" y="352" fill="#00FF66" font-family="'Courier New', monospace" font-weight="bold" font-size="18" text-anchor="middle" letter-spacing="2">220.0000 g</text>

    <!-- Draft Shield Glass Chamber -->
    <rect x="70" y="70" width="300" height="250" rx="8" fill="url(#glassGrad)" stroke="#38BDF8" stroke-width="2"/>
    <!-- Glass Shield Top Door Handle -->
    <rect x="180" y="62" width="80" height="8" rx="4" fill="#0F2C59"/>

    <!-- Internal Weighing Pan & Column -->
    <rect x="215" y="220" width="10" height="100" fill="#94A3B8"/>
    <ellipse cx="220" cy="220" rx="60" ry="14" fill="url(#panGrad)" stroke="#64748B" stroke-width="1.5"/>
    
    <!-- Leveling Bubble Indicator -->
    <circle cx="90" cy="346" r="10" fill="#0284C7" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="90" cy="346" r="3" fill="#FFF"/>

    <!-- Aczet Branding on Unit -->
    <text x="70" y="50" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="22">aczet<tspan fill="#E55604">.</tspan></text>
    <text x="370" y="50" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" text-anchor="end">CY 224 &#8226; 0.1 mg</text>
  </g>

  <!-- Technical Spec Badge Overlay -->
  <g transform="translate(480, 480)">
    <rect width="260" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="20" y="30" fill="#E55604" font-family="sans-serif" font-weight="bold" font-size="13">ISO 9001 &#8226; GLP/GMP READY</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="sans-serif" font-size="14">Motorized Auto-Cal (isoCAL)</text>
  </g>
</svg>
