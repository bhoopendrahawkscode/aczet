<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="indBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="ssPan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#indBg)"/>

  <!-- Industrial Scale Platform & Column Indicator -->
  <g transform="translate(160, 120)">
    <!-- Stainless Steel Diamond Plate Pan Base -->
    <path d="M 40 320 L 440 320 L 480 390 L 0 390 Z" fill="url(#ssPan)" stroke="#475569" stroke-width="2"/>
    
    <!-- Heavy Duty Feet -->
    <rect x="20" y="390" width="30" height="15" rx="3" fill="#334155"/>
    <rect x="430" y="390" width="30" height="15" rx="3" fill="#334155"/>

    <!-- Stainless Column Pipe -->
    <rect x="60" y="90" width="16" height="230" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>

    <!-- IP68 Sealed Stainless Indicator Terminal -->
    <rect x="20" y="50" width="180" height="90" rx="8" fill="#0F2C59" stroke="#E55604" stroke-width="2"/>
    <rect x="35" y="65" width="150" height="40" rx="4" fill="#020617"/>
    <text x="110" y="92" fill="#EF4444" font-family="'Courier New', monospace" font-weight="bold" font-size="22" text-anchor="middle">600.00 kg</text>
    <text x="110" y="125" fill="#38BDF8" font-family="sans-serif" font-size="11" text-anchor="middle">IP68 WATERPROOF</text>

    <!-- Branding -->
    <text x="440" y="50" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="22" text-anchor="end">aczet<tspan fill="#E55604">.</tspan></text>
    <text x="440" y="75" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="end">IS-600S PLATFORM</text>
  </g>
</svg>
