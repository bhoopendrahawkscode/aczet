<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <linearGradient id="scannerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rubberGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="scannerShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#scannerShadow)">
    <!-- USB Cable coming out of bottom of handle -->
    <path d="M 85,125 C 80,140 40,145 35,130 L 35,100" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
    <!-- USB Connector A -->
    <rect x="31" y="85" width="8" height="15" rx="1.5" fill="#475569"/>
    <rect x="32" y="78" width="6" height="7" fill="#cbd5e1"/>

    <!-- Handheld Gun Handle -->
    <path d="M 82,60 L 98,62 C 102,75 106,105 92,122 C 86,128 78,126 76,120 C 72,106 74,80 82,60 Z" fill="url(#rubberGrip)"/>

    <!-- Red Trigger Switch -->
    <path d="M 76,70 C 69,72 68,80 75,84 Z" fill="#ef4444"/>

    <!-- Scanner Head & Optic Window -->
    <!-- Head Body -->
    <path d="M 68,36 C 75,25 115,22 130,35 C 142,46 142,56 130,64 C 112,68 85,62 68,36 Z" fill="url(#scannerBody)"/>
    <!-- Top Rubber Bumper Ring -->
    <path d="M 70,35 C 80,24 116,21 128,34" stroke="#00829B" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Front Optical Exit Window (Left angled face) -->
    <polygon points="68,36 80,56 75,64 62,42" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <!-- Red Laser / CCD Optical lens element -->
    <ellipse cx="71" cy="49" rx="3" ry="8" transform="rotate(-30 71 49)" fill="#dc2626"/>

    <!-- Blue/Green Aiming LED / Indicator on top -->
    <circle cx="112" cy="34" r="3" fill="#00829B"/>

    <!-- Aczet Branding on gun side -->
    <text x="105" y="48" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#ffffff">aczet</text>
  </g>
</svg>
