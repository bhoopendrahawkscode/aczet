<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="moistBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="heatGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#moistBg)"/>

  <!-- Moisture Analyzer Hood and Base -->
  <g transform="translate(180, 110)">
    <!-- Base Body -->
    <rect x="50" y="220" width="340" height="150" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Touchscreen Graph Display -->
    <rect x="70" y="240" width="300" height="110" rx="10" fill="#0A192F" stroke="#E55604" stroke-width="2"/>
    <text x="90" y="270" fill="#FF9F66" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="16">MOISTURE: 8.42 %</text>
    <text x="90" y="295" fill="#38BDF8" font-family="'Courier New', monospace" font-size="14">Temp: 105°C | Time: 04:32 min</text>
    
    <!-- Real-time Drying Curve Graph Line -->
    <path d="M 90 330 Q 160 305 240 315 T 350 318" fill="none" stroke="#00FF66" stroke-width="3"/>

    <!-- Halogen Heating Chamber Hood (Top) -->
    <path d="M 90 220 L 350 220 L 320 80 L 120 80 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Circular Halogen Lamp Element Glow -->
    <ellipse cx="220" cy="150" rx="80" ry="25" fill="url(#heatGlow)" opacity="0.85"/>
    <ellipse cx="220" cy="150" rx="40" ry="12" fill="#FFF"/>

    <!-- Branding -->
    <text x="70" y="50" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="22">aczet<tspan fill="#E55604">.</tspan></text>
    <text x="370" y="50" fill="#FF9800" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="end">MB 200 &#8226; HALOGEN</text>
  </g>
</svg>
